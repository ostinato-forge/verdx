[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verdx"
version = "1.0.0"
description = "Deterministic verification engine with pluggable domain gates"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [
    { name = "eparenti" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "click>=8.1",
    "lxml>=5.0",
    "pexpect>=4.9",
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "types-PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[project.scripts]
verdx = "verdx.cli:main"

[project.entry-points."verdx.domains"]
markdown = "verdx.domains.markdown:register_domain"
example = "verdx.domains.example:register_domain"

[project.entry-points."verdx.fixers"]
markdown = "verdx.domains.markdown.fixers:get_fixers"
example = "verdx.domains.example.fixers:get_fixers"

[tool.hatch.build.targets.wheel]
packages = ["src/verdx"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/test_*_properties.py" = ["E402"]
"tests/**/test_*_key_properties.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["verdx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -v --cov=verdx --cov-report=term-missing"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["verdx"]
mypy_path = "src"

[tool.coverage.run]
source = ["verdx"]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true
